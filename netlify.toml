# Statische Auslieferung ohne Build-Schritt.
[build]
  publish = "."
  command = ""

# Saubere Adressen: /formular statt /formular.html
[[redirects]]
  from = "/formular"
  to = "/formular.html"
  status = 200

[[redirects]]
  from = "/impressum"
  to = "/impressum.html"
  status = 200

[[redirects]]
  from = "/datenschutz"
  to = "/datenschutz.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=()"
    # Die Seite laedt ausschliesslich eigene Dateien. Ein Verstoss gegen diese
    # Regel faellt sofort auf — genau das ist hier der Zweck: versehentlich
    # eingebaute Fremdressourcen (Fonts, Karten, Zaehlpixel) werden blockiert,
    # statt still Patientendaten abfliessen zu lassen.
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; font-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
